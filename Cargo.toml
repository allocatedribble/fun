[workspace]
members = [
    "fun_editor_core",
    "fun-asset",
    "fun_dx12_dlss",
    "fun-ecs",
    "fun-ecs-macros",
    "fun_host",
    "fun-lux",
    "fun-scene",
    "fun-scene-macros",
    "fun-renderer",
    "game_client",
    "game_client/ui/rvelte_bridge",
    "game_launcher",
    "game_shared",
    "tools/arena_bake",
    "tools/virtual_geometry_bake",
]
default-members = ["game_launcher"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.1"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
str_to_string = "deny"
inefficient_to_string = "deny"
unnecessary_to_owned = "deny"
cmp_owned = "deny"
string_add = "deny"
string_add_assign = "deny"
format_push_string = "deny"
format_collect = "deny"
to_string_in_format_args = "deny"
manual_string_new = "deny"
redundant_clone = "deny"
implicit_clone = "warn"

[workspace.dependencies]
compactly = "0.1.6"
criterion = { version = "0.8.2", features = ["html_reports"] }
fun_lux = { package = "fun-lux", path = "fun-lux" }
fun_ai_core = { path = "../fun-ai/crates/fun_ai_core" }
fun_asset = { package = "fun-asset", path = "fun-asset" }
fun_ecs = { package = "fun-ecs", path = "fun-ecs" }
fun_ecs_macros = { package = "fun-ecs-macros", path = "fun-ecs-macros" }
fun_engine = { package = "fun-engine", path = "../fun-engine/crates/fun-engine", default-features = false }
fun_window = { package = "fun-window", path = "../fun-engine/crates/fun-window", default-features = false }
fun_renderer = { package = "fun-renderer", path = "fun-renderer" }
fun_scene = { package = "fun-scene", path = "fun-scene" }
fun_scene_macros = { package = "fun-scene-macros", path = "fun-scene-macros" }
fun_telemetry_core = { package = "fun-telemetry-core", path = "../fun-data/crates/fun-telemetry-core" }
flume = "0.12.0"
hashbrown = { version = "0.17.1", features = ["nightly"] }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
pollster = "0.4.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15.1"
thunder = { path = "../thunder" }
tracing = "0.1"
wgpu = { version = "29.0.3", default-features = false, features = ["dx12", "vulkan", "metal", "wgsl"] }
zeroize = "1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

[profile.wasm-release]
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
