[package]
name = "fun-renderer"
edition.workspace = true
version.workspace = true

[lib]
name = "fun_renderer"

[lints]
workspace = true

[features]
default = ["bevy_ecs", "fun_renderer_core", "native_ui_adapter", "wgpu_bridge"]
bevy_ecs = ["dep:bevy_app", "dep:bevy_camera", "dep:bevy_ecs", "dep:bevy_transform"]
native_ui_adapter = [
    "bevy_ecs",
    "dep:rvelte-core",
    "dep:rvelte-fun-render-adapter",
    "dep:rvelte-fun-ui-core",
]
native_ui_gpu_only = []
dlss = []
dx12_native_interop = []
experimental_work_graphs = []
experimental_renderer_ml = ["dep:fun_ai_core"]
frame_generation = []
fsr = []
fun_renderer_core = []
hybrid_gi = ["fun_lux/hybrid_gi"]
learned_page_priority_predictor = ["experimental_renderer_ml"]
legacy_renderer = []
many_light = ["fun_lux/many_light"]
mesh_shader_path = []
metal_backend = []
neural_texture_compression = []
upscaling = []
virtual_geometry = []
virtual_shadows = ["fun_lux/virtual_shadows"]
vulkan_backend = []
wgpu_bridge = ["dep:naga", "dep:wgpu"]
# V2-3A / V2-3C: pull in the cross-subsystem schedule contract types
# (`fun_scheduler_types`) so the renderer can emit typed
# `RendererSchedulePlanV1` records and map `FrameGraphPassRole` /
# `LuxResourceIntentKind` to the canonical `TaskClass` / `BudgetOrigin`
# taxonomies. Opt-in because the renderer must stay buildable without
# the scheduler workspace present.
schedule_contract = ["dep:fun-scheduler-types"]

# FS-M1.4E: layer the graph-shaped renderer adapter (render_work_graph)
# on top of `schedule_contract`. This pulls in `fun-scheduler-core` so
# the renderer can drive its `RendererWorkGraph` through the
# deterministic single-thread executor. Strict superset of
# `schedule_contract`.
schedule_graph = ["schedule_contract", "dep:fun-scheduler-core"]

# Compatibility aliases for Pass 1 callers. New code should use the canonical
# ownership-oriented names above.
fun_lux_hybrid_gi = ["hybrid_gi"]
fun_lux_many_light = ["many_light"]
fun_lux_virtual_shadows = ["virtual_shadows"]
fun_renderer_dlss = ["dlss"]
fun_renderer_dx12 = ["dx12_native_interop"]
fun_renderer_experimental_ml = ["experimental_renderer_ml"]
fun_renderer_frame_generation = ["frame_generation"]
fun_renderer_fsr = ["fsr"]
fun_renderer_legacy = ["legacy_renderer"]
fun_renderer_metal = ["metal_backend"]
fun_renderer_new_core = ["fun_renderer_core"]
fun_renderer_upscale = ["upscaling"]
fun_renderer_vulkan = ["vulkan_backend"]

[dependencies]
bevy_app = { workspace = true, optional = true }
bevy_camera = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
bevy_transform = { workspace = true, optional = true }
fun_lux.workspace = true
fun_ai_core = { workspace = true, optional = true }
fun_ecs.workspace = true
fun_scene.workspace = true
fun_telemetry_core.workspace = true
flume.workspace = true
hashbrown.workspace = true
fun-scheduler-types = { path = "../../fun-scheduler/crates/fun-scheduler-types", optional = true }
fun-scheduler-core = { path = "../../fun-scheduler/crates/fun-scheduler-core", optional = true }
rvelte-core = { path = "../../rvelte/crates/rvelte-core", optional = true }
rvelte-fun-render-adapter = { path = "../../rvelte/crates/rvelte-fun-render-adapter", optional = true }
rvelte-fun-ui-core = { path = "../../rvelte/crates/rvelte-fun-ui-core", optional = true }
serde.workspace = true
serde_json.workspace = true
naga = { version = "29.0.3", default-features = false, features = [
    "wgsl-in",
], optional = true }
wgpu = { version = "29.0.3", default-features = false, features = [
    "wgsl",
    "dx12",
    "vulkan",
    "metal",
    "naga-ir",
], optional = true }

# Dev-only: the Pass M windowed surface present integration test
# (`live_passm_runs_real_windowed_surface_present_against_winit_window`)
# creates a real winit window + real wgpu surface to satisfy the
# typed `IntegrationTestCategory::SurfacePresent` evidence kind. winit
# stays out of the library proper.
[dev-dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
fun-scheduler-testkit = { path = "../../fun-scheduler/crates/fun-scheduler-testkit" }
