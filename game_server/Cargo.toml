[package]
name = "game_server"
edition.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
release-telemetry = ["server-ingest", "telemetry-retention"]
client-telemetry = []
server-ingest = ["dep:fun_telemetry_core"]
crash-telemetry = []
debug-diagnostics = ["diagnostics", "server-ingest", "telemetry-rendered-views"]
debug-benchmarks = ["server-ingest"]
local-debug-captures = ["debug-diagnostics"]
telemetry-upload = []
telemetry-retention = ["server-ingest"]
telemetry-rendered-views = ["server-ingest"]
diagnostics = ["game_shared/diagnostics"]

[dependencies]
avian3d.workspace = true
bevy.workspace = true
bevy_quinnet.workspace = true
fun-warden-protocol = { path = "../../fun-warden/crates/fun-warden-protocol" }
fun-warden-server = { path = "../../fun-warden/crates/fun-warden-server" }
fun_ai_core = { path = "../../fun-ai/crates/fun_ai_core" }
fun_ai_inference = { path = "../../fun-ai/crates/fun_ai_inference" }
fun_ai_tactics = { path = "../../fun-ai/crates/fun_ai_tactics" }
fun_telemetry_core = { workspace = true, optional = true }
fun_scene.workspace = true
game_scene = { path = "../game_scene" }
game_shared = { path = "../game_shared" }
hashbrown.workspace = true
log.workspace = true
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
thunder.workspace = true
tracing.workspace = true
