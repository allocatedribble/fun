name: DX12 Perf Gates

on:
  pull_request:
    paths:
      - ".github/workflows/dx12-perf-gates.yml"
      - ".dx12_change_category"
      - "docs/client_benchmarking.md"
      - "docs/dx12_dlss_boundary_gate.md"
      - "docs/dx12_implementation_doctrine.md"
      - "docs/dx12_parity_decision_pass.md"
      - "scripts/benchmark_client.ps1"
      - "scripts/benchmark_dx12_parity.ps1"
      - "tools/check_dx12_doctrine.ps1"
      - "tools/check_dx12_perf_regression.ps1"
      - "tools/dx12_perf_baseline_envelopes.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dx12-perf-gates.yml"
      - ".dx12_change_category"
      - "docs/client_benchmarking.md"
      - "docs/dx12_dlss_boundary_gate.md"
      - "docs/dx12_implementation_doctrine.md"
      - "docs/dx12_parity_decision_pass.md"
      - "scripts/benchmark_client.ps1"
      - "scripts/benchmark_dx12_parity.ps1"
      - "tools/check_dx12_doctrine.ps1"
      - "tools/check_dx12_perf_regression.ps1"
      - "tools/dx12_perf_baseline_envelopes.json"
  workflow_dispatch:
    inputs:
      run_hardware_matrix:
        description: "Run the non-blocking self-hosted Windows DX12 matrix."
        required: false
        default: false
        type: boolean
      matrix_size:
        description: "DX12 parity matrix size for hardware runners."
        required: false
        default: "quick"
        type: choice
        options:
          - quick
          - full
          - present
      baseline_json:
        description: "Optional baseline summary.json path on the hardware runner."
        required: false
        default: ""
        type: string
      current_json:
        description: "Optional current summary.json path on the hardware runner."
        required: false
        default: ""
        type: string
      lane:
        description: "Perf envelope lane name."
        required: false
        default: "dx12_required_steady_state"
        type: string

jobs:
  correctness:
    name: correctness-only perf gate checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Check Rust DX12 doctrine gate
        shell: pwsh
        run: |
          if (-not (Test-Path ..\fun-cli\Cargo.toml)) {
            Write-Warning "Skipping standalone fun DX12 gate because sibling ..\fun-cli is unavailable. Umbrella data-platform Rust cutover CI runs the authoritative gate."
            exit 0
          }
          cargo run --quiet --manifest-path ..\fun-cli\Cargo.toml -p fun-bench -- dx12-doctrine-check --fun-root . --self-test
          cargo run --quiet --manifest-path ..\fun-cli\Cargo.toml -p fun-bench -- dx12-doctrine-check --fun-root .
      - name: Check Rust DX12 perf gate
        shell: pwsh
        run: |
          if (-not (Test-Path ..\fun-cli\Cargo.toml)) {
            Write-Warning "Skipping standalone fun DX12 perf gate because sibling ..\fun-cli is unavailable. Umbrella data-platform Rust cutover CI runs the authoritative gate."
            exit 0
          }
          cargo run --quiet --manifest-path ..\fun-cli\Cargo.toml -p fun-bench -- dx12-perf-regression-check --fun-root . --self-test
      - name: Check DX12 parity report command
        shell: pwsh
        run: |
          if (-not (Test-Path ..\fun-cli\Cargo.toml)) {
            Write-Warning "Skipping standalone fun DX12 report command because sibling ..\fun-cli is unavailable. Umbrella data-platform Rust cutover CI runs the authoritative report fixture."
            exit 0
          }
          cargo run --quiet --manifest-path ..\fun-cli\Cargo.toml -p fun-data-cli --bin fun-data -- report dx12-parity --self-test

  cutover-fixtures:
    name: nested fun Rust fixture artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Emit Rust fixture artifacts when umbrella cockpit is present
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\data-platform-cutover\fun-fixtures | Out-Null
          if (-not (Test-Path ..\fun-cli\Cargo.toml)) {
            @{
              schema = "fun.data_platform.nested_cutover_skip.v1"
              reason = "sibling_fun_cli_unavailable"
              owner = "umbrella data-platform Rust cutover workflow"
            } | ConvertTo-Json | Set-Content target\data-platform-cutover\fun-fixtures\skip.json
            Write-Warning "Skipping nested Rust fixture commands; umbrella root CI owns the authoritative cutover gate."
            exit 0
          }
          cargo run --quiet --manifest-path ..\fun-cli\Cargo.toml -p fun-bench -- dx12-parity --fun-root . --matrix-size present --plan-only --output-root target\data-platform-cutover\fun-fixtures\dx12-parity-plan --format json --output target\data-platform-cutover\fun-fixtures\dx12-parity-plan.json
          cargo run --quiet --manifest-path ..\fun-cli\Cargo.toml -p fun-data-cli --bin fun-data -- report dx12-parity --self-test --format json --output target\data-platform-cutover\fun-fixtures\dx12-parity-report.json
      - name: Upload nested Rust fixture artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nested-fun-rust-fixtures
          path: target/data-platform-cutover/fun-fixtures/**
          if-no-files-found: warn

  hardware-perf:
    name: non-blocking hardware DX12 perf matrix
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hardware_matrix }}
    runs-on: [self-hosted, windows, dx12-perf]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: project-FUN/fun
      - name: Run DX12 parity matrix when sibling path dependencies are present
        shell: pwsh
        working-directory: project-FUN/fun
        run: |
          $missing = @()
          foreach ($path in @("..\bevy", "..\avian", "..\thunder", "..\bevy_quinnet")) {
            if (-not (Test-Path $path)) {
              $missing += $path
            }
          }
          if ($missing.Count -gt 0) {
            Write-Warning "Skipping hardware matrix because sibling path dependencies are missing: $($missing -join ', ')"
            exit 0
          }
          if (-not (Test-Path ..\fun-cli\Cargo.toml)) {
            Write-Warning "Skipping hardware matrix because sibling ..\fun-cli is unavailable."
            exit 0
          }
          cargo run --quiet --manifest-path ..\fun-cli\Cargo.toml -p fun-bench -- dx12-parity --fun-root . --matrix-size "${{ inputs.matrix_size }}" --continue-on-failure --output-root "target\benchmarks\dx12_parity\ci"
      - name: Compare supplied baseline/current summaries
        if: ${{ inputs.baseline_json != '' && inputs.current_json != '' }}
        shell: pwsh
        working-directory: project-FUN/fun
        run: |
          if (-not (Test-Path ..\fun-cli\Cargo.toml)) {
            Write-Warning "Skipping supplied baseline/current comparison because sibling ..\fun-cli is unavailable."
            exit 0
          }
          cargo run --quiet --manifest-path ..\fun-cli\Cargo.toml -p fun-bench -- dx12-perf-regression-check `
            --fun-root . `
            --baseline "${{ inputs.baseline_json }}" `
            --current "${{ inputs.current_json }}" `
            --lane "${{ inputs.lane }}" `
            --report-path "target\benchmarks\dx12_perf_gate\report.md" `
            --json-out "target\benchmarks\dx12_perf_gate\report.json"
      - name: Upload DX12 perf artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dx12-perf-artifacts
          path: |
            project-FUN/fun/target/benchmarks/dx12_parity/**
            project-FUN/fun/target/benchmarks/dx12_perf_gate/**
          if-no-files-found: ignore
