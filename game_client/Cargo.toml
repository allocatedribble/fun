[package]
name = "game_client"
edition.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
release-telemetry = [
    "client-telemetry",
    "crash-telemetry",
    "telemetry-upload",
    "telemetry-retention",
]
client-telemetry = ["dep:fun_telemetry_core"]
server-ingest = []
crash-telemetry = ["client-telemetry"]
debug-diagnostics = [
    "client-telemetry",
    "telemetry-retention",
    "telemetry-rendered-views",
]
debug-benchmarks = ["debug-diagnostics"]
local-debug-captures = ["debug-diagnostics"]
telemetry-upload = ["client-telemetry"]
telemetry-retention = ["client-telemetry"]
telemetry-rendered-views = ["client-telemetry"]

[dependencies]
fun_telemetry_core = { workspace = true, optional = true }
fun_ecs.workspace = true
fun_engine = { workspace = true, features = ["default-stack", "renderer-fun", "interactive-winit"] }
tracing.workspace = true
