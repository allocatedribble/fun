[package]
name = "game_client"
edition.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["dlss", "volumetric_clouds"]
release-telemetry = [
    "client-telemetry",
    "crash-telemetry",
    "telemetry-upload",
    "telemetry-retention",
]
client-telemetry = ["dep:fun_telemetry_core"]
server-ingest = []
crash-telemetry = ["client-telemetry"]
debug-diagnostics = [
    "diagnostics",
    "render_diagnostics",
    "client-telemetry",
    "telemetry-retention",
    "telemetry-rendered-views",
]
debug-benchmarks = ["benchmarks", "debug-diagnostics"]
local-debug-captures = ["debug-diagnostics"]
telemetry-upload = ["client-telemetry"]
telemetry-retention = ["client-telemetry"]
telemetry-rendered-views = ["client-telemetry"]
benchmarks = [
    "render_diagnostics",
    "fun_render/benchmarks",
    "client-telemetry",
    "telemetry-retention",
]
bevy_debug = ["bevy/debug"]
cef_ui = ["dep:fun_ui_cef"]
cef_ui_dx12_accelerated_paint = [
    "cef_ui",
    "dep:wgpu",
    "dep:windows",
    "fun_render/dx12_native_interop",
]
dx12_native_object_names = [
    "cef_ui_dx12_accelerated_paint",
    "fun_render/dx12_native_object_names",
]
diagnostics = ["game_shared/diagnostics", "fun_render/diagnostics"]
dlss = ["bevy/dlss", "fun_render/dlss"]
dx12_dlss_native = ["fun_render/dx12_dlss_native"]
force_disable_dlss = ["bevy/force_disable_dlss", "fun_render/force_disable_dlss"]
render_diagnostics = [
    "diagnostics",
    "bevy/debug",
    "bevy/track_location",
    "bevy/pbr_debug_diagnostics",
    "bevy/meshlet_debug_diagnostics",
    "fun_render/render_diagnostics",
]
volumetric_clouds = ["fun_render/volumetric_clouds"]

[dependencies]
avian3d.workspace = true
bevy.workspace = true
bevy_quinnet.workspace = true
fun_render = { path = "../fun_render", default-features = false, features = [
    "winit_presentation",
    "fun_renderer_core",
] }
fun_scene.workspace = true
fun_telemetry_core = { workspace = true, optional = true }
fun_host = { path = "../fun_host" }
fun_ui_cef = { path = "../fun_ui_cef", optional = true }
fun-warden-client = { path = "../../fun-warden/crates/fun-warden-client" }
fun-warden-core = { path = "../../fun-warden/crates/fun-warden-core" }
fun-warden-protocol = { path = "../../fun-warden/crates/fun-warden-protocol" }
fun_ai_core = { path = "../../fun-ai/crates/fun_ai_core" }
game_scene = { path = "../game_scene" }
game_shared = { path = "../game_shared" }
log.workspace = true
serde_json.workspace = true
thunder.workspace = true
tracing.workspace = true
wgpu = { version = "29.0.3", default-features = false, features = ["dx12"], optional = true }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D11on12",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "client_costs"
harness = false
required-features = ["benchmarks"]
