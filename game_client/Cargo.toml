[package]
name = "game_client"
edition.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["dlss"]
benchmarks = ["render_diagnostics"]
bevy_debug = ["bevy/debug"]
diagnostics = ["game_shared/diagnostics"]
dlss = ["bevy/dlss"]
force_disable_dlss = ["bevy/force_disable_dlss"]
render_diagnostics = [
    "diagnostics",
    "bevy/debug",
    "bevy/track_location",
    "bevy/pbr_debug_diagnostics",
    "bevy/meshlet_debug_diagnostics",
]

[dependencies]
avian3d.workspace = true
bevy.workspace = true
bevy_quinnet.workspace = true
game_shared = { path = "../game_shared" }
log.workspace = true
thunder.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "client_costs"
harness = false
required-features = ["benchmarks"]
