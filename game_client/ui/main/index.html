<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' fun-ui:; script-src 'self' fun-ui:; style-src 'self' fun-ui:; img-src 'self' fun-ui: data:; connect-src 'self' fun-ui:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fun Hello UI</title>
    <link rel="stylesheet" href="fun-ui://main/assets/app.css" />
  </head>
  <body>
    <div id="app" data-route="hud">
      <main class="hello-layer" data-panel="hello">
        <section class="hello-panel" aria-label="Hello world UI" data-hit-region="diagnostics">
          <p class="hello-kicker">CEF UI loaded</p>
          <h1>Hello, world</h1>
          <p class="hello-copy">fun-ui://main/index.html</p>
          <button type="button" data-command="hello">Ping host</button>
        </section>
        <aside class="status-strip" aria-label="UI status">
          <span data-field="route">hud</span>
          <span data-field="bridge">bridge ready</span>
        </aside>
      </main>
    </div>
    <script src="fun-ui://main/assets/app.js"></script>
  </body>
</html>
