[package]
name = "fun_render"
edition.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["offscreen", "volumetric_clouds"]
benchmarks = []
cloud_diagnostics = ["render_diagnostics"]
diagnostics = ["game_shared/diagnostics"]
dlss = ["bevy/dlss"]
dx12_dlss_native = ["dx12_native_interop", "dep:fun_dx12_dlss"]
dx12_mesh_shader_experiment = ["dx12_native_interop"]
dx12_native_interop = ["wgpu/dx12", "dep:windows-core"]
dx12_native_object_names = ["dx12_native_interop", "dep:windows"]
force_disable_dlss = ["bevy/force_disable_dlss"]
fun_lux_hybrid_gi = ["fun_renderer/fun_lux_hybrid_gi"]
fun_lux_many_light = ["fun_renderer/fun_lux_many_light"]
fun_lux_virtual_shadows = ["fun_renderer/fun_lux_virtual_shadows"]
fun_renderer_cef_gpu_only = ["fun_renderer/fun_renderer_cef_gpu_only"]
fun_renderer_dlss = ["fun_renderer/fun_renderer_dlss"]
fun_renderer_dx12 = ["fun_renderer/fun_renderer_dx12"]
fun_renderer_experimental_ml = ["fun_renderer/fun_renderer_experimental_ml"]
fun_renderer_frame_generation = ["fun_renderer/fun_renderer_frame_generation"]
fun_renderer_fsr = ["fun_renderer/fun_renderer_fsr"]
fun_renderer_legacy = ["fun_renderer/fun_renderer_legacy"]
fun_renderer_new_core = ["fun_renderer/fun_renderer_new_core"]
fun_renderer_upscale = ["fun_renderer/fun_renderer_upscale"]
fun_renderer_vulkan = ["fun_renderer/fun_renderer_vulkan"]
offscreen = []
render_diagnostics = [
    "diagnostics",
    "bevy/debug",
    "bevy/track_location",
    "bevy/pbr_debug_diagnostics",
    "bevy/meshlet_debug_diagnostics",
]
volumetric_clouds = []
winit_presentation = []

[dependencies]
bevy.workspace = true
fun_dx12_dlss = { path = "../fun_dx12_dlss", optional = true }
fun_renderer.workspace = true
game_shared = { path = "../game_shared" }
serde.workspace = true
thunder.workspace = true
tracing.workspace = true
wgpu = { version = "29.0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-core = { version = "0.62", optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_Graphics_Direct3D12"] }
