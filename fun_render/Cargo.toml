[package]
name = "fun_render"
edition.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["offscreen", "volumetric_clouds"]
benchmarks = []
cef_gpu_only = ["fun_renderer/cef_gpu_only"]
cloud_diagnostics = ["render_diagnostics"]
diagnostics = ["game_shared/diagnostics"]
dlss = ["bevy/dlss", "fun_renderer/dlss"]
dx12_dlss_native = ["dx12_native_interop", "dep:fun_dx12_dlss"]
dx12_mesh_shader_experiment = ["dx12_native_interop"]
dx12_native_interop = ["wgpu/dx12", "dep:windows-core", "fun_renderer/dx12_native_interop"]
dx12_native_object_names = ["dx12_native_interop", "dep:windows"]
experimental_renderer_ml = ["fun_renderer/experimental_renderer_ml"]
frame_generation = ["fun_renderer/frame_generation"]
force_disable_dlss = ["bevy/force_disable_dlss"]
fsr = ["fun_renderer/fsr"]
fun_lux_hybrid_gi = ["hybrid_gi"]
fun_lux_many_light = ["many_light"]
fun_lux_virtual_shadows = ["virtual_shadows"]
fun_renderer_cef_gpu_only = ["cef_gpu_only"]
fun_renderer_dlss = ["dlss"]
fun_renderer_dx12 = ["fun_renderer/fun_renderer_dx12"]
fun_renderer_experimental_ml = ["experimental_renderer_ml"]
fun_renderer_frame_generation = ["frame_generation"]
fun_renderer_fsr = ["fsr"]
fun_renderer_legacy = ["legacy_renderer"]
fun_renderer_new_core = ["fun_renderer_core"]
fun_renderer_upscale = ["upscaling"]
fun_renderer_vulkan = ["vulkan_backend"]
fun_renderer_core = ["fun_renderer/fun_renderer_core"]
hybrid_gi = ["fun_renderer/hybrid_gi"]
legacy_renderer = ["fun_renderer/legacy_renderer"]
many_light = ["fun_renderer/many_light"]
offscreen = []
render_diagnostics = [
    "diagnostics",
    "bevy/debug",
    "bevy/track_location",
    "bevy/pbr_debug_diagnostics",
    "bevy/meshlet_debug_diagnostics",
]
upscaling = ["fun_renderer/upscaling"]
virtual_geometry = ["fun_renderer/virtual_geometry"]
virtual_shadows = ["fun_renderer/virtual_shadows"]
volumetric_clouds = []
vulkan_backend = ["fun_renderer/vulkan_backend"]
winit_presentation = []

[dependencies]
bevy.workspace = true
fun_dx12_dlss = { path = "../fun_dx12_dlss", optional = true }
fun_renderer.workspace = true
game_shared = { path = "../game_shared" }
serde.workspace = true
serde_json.workspace = true
thunder.workspace = true
tracing.workspace = true
wgpu = { version = "29.0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-core = { version = "0.62", optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_Graphics_Direct3D12"] }
